name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Extrair versão da tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar instalador Windows
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\windows\taqciti.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Instalar makeself
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Extrair versão da tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar instalador Linux
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash installer/linux/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: release/*.run
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Extrair versão da tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar instalador macOS
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash installer/macos/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.pkg
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release-assets

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*
          generate_release_notes: true

  # Canal de distribuição adicional pro time que ainda não tem acesso ao
  # GitHub — a Release acima continua existindo e é o canal técnico/de
  # auditoria; este job só soma o Drive como segundo destino, nunca
  # substitui. Só roda depois que os 3 builds E a Release já tiverem
  # terminado com sucesso ("needs: [release]" cobre isso transitivamente,
  # já que o job release também depende dos 3 builds).
  distribute-gdrive:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: gdrive-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: gdrive-assets

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: gdrive-assets

      # Autentica como a Service Account (sem fluxo OAuth interativo) e
      # gera um access token de curta duração. O token é registrado pela
      # própria action como segredo (mascarado nos logs), além da chave
      # JSON crua em si já ser mascarada automaticamente pelo Actions por
      # vir de um "secrets.*".
      - name: Autenticar no Google Drive
        id: gdrive-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SA_KEY }}
          token_format: access_token

      - name: Publicar instaladores no Google Drive
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.gdrive-auth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_TAQCITI_FOLDER_ID }}
        run: bash .github/scripts/upload-to-gdrive.sh gdrive-assets
