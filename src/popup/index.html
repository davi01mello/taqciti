<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>TaqCITi</title>
    <style>
      /*
       * O popup do Chrome é a única superfície que NÃO tem altura de janela: o
       * navegador mede a altura do documento e dimensiona a janelinha a partir
       * dela. Por isso aqui não existe cadeia de `height: 100%` — ela daria
       * zero. O que o shell precisa é de um TETO, e o teto é o `max-height`
       * abaixo: é contra ele que a faixa do meio consegue encolher e rolar.
       *
       * `overflow: hidden` é seguro aqui (diferente da janela principal):
       * nada pode ficar fora do alcance, porque o documento nunca é mais alto
       * que o teto — quem passa do teto é a região de rolagem interna.
       */
      html {
        margin: 0;
      }
      body {
        margin: 0;
        width: 372px;
        min-height: 300px;
        max-height: 560px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
