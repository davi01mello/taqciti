<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaqCiti</title>
    <!--
      Inter vem do pacote da própria extensão, não do Google Fonts: uma página
      de extensão que busca fonte na internet falha offline, vaza a visita para
      um terceiro e ainda esbarra na CSP de `extension_pages`. O fallback é a
      fonte do sistema, que é sóbria o bastante para o desenho não quebrar.
    -->
    <style>
      /*
       * `min-height`, e NÃO `height`. Quem rola aqui é a página inteira — a
       * conversa, a escrita e a onda são um fluxo só, e ele passa da altura da
       * janela assim que a conversa cresce. Com `height: 100%` o `#root` ficaria
       * travado na janela e o conteúdo transbordaria dele.
       */
      html,
      body,
      #root {
        min-height: 100%;
      }
      html {
        overflow-x: hidden;
        overscroll-behavior: none;
        /* O mesmo tom do resto da superfície: sem isto, o instante entre a
           janela abrir e o React montar pisca com outra cor. */
        background: rgb(15 18 19);
      }
      body {
        margin: 0;
        min-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
