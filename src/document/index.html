<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaqCITi — Transcrição</title>
    <style>
      /* Os três elos da cadeia de altura (html, body, #root) precisam de
         altura DEFINIDA: sem isso um filho com `height: 100%` não tem contra o
         que medir e colapsa. A válvula de escape fica no <html>, que é quem
         rola quando o conteúdo passa da janela. */
      html,
      body,
      #root {
        height: 100%;
      }
      html {
        overflow: auto;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
